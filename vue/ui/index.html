<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter (Vue)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100vh; min-height: 100vh; overflow: hidden;
            font-family: "SF Pro", "Roboto", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #030b16; color: #fff; -webkit-font-smoothing: antialiased;
        }
        .app-shell {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            padding: 64px 24px 32px;
        }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
        .header .badge {
            display: inline-block; margin-top: 6px; padding: 3px 10px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
            background: rgba(66, 184, 131, 0.15); color: #42b883;
            border-radius: 99px; text-transform: uppercase;
        }
        .header p { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,0.5); letter-spacing: -0.23px; }

        .player-info {
            background: #101622; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 14px 18px; margin-bottom: 20px;
        }
        .player-info .label { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: -0.23px; margin-bottom: 4px; }
        .player-info .value { font-size: 16px; font-weight: 510; letter-spacing: -0.4px; }

        .counter-display {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 28px; min-height: 0;
        }
        .counter-value {
            font-size: 96px; font-weight: 700; color: #42b883; letter-spacing: -2px;
            text-shadow: 0 0 24px rgba(66,184,131,0.25);
            transition: transform 0.15s ease;
        }
        .counter-value.pulse { transform: scale(1.08); }
        .button-group { display: flex; gap: 16px; }
        .btn {
            width: 64px; height: 64px; border: none; border-radius: 50%;
            font-size: 28px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease, opacity 0.15s ease;
            box-shadow: inset 0 4px 2px rgba(255,255,255,0.25), 0 6px 16px rgba(0,0,0,0.35);
        }
        .btn:active { transform: scale(0.94); opacity: 0.9; }
        .btn-decrement { background: linear-gradient(180deg, #ff6b6b, #d94545); color: #fff; }
        .btn-increment { background: linear-gradient(180deg, #42b883, #2a8b5f); color: #fff; }

        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .action-btn {
            width: 100%; height: 48px; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 510; letter-spacing: -0.23px; cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .action-btn:active { opacity: 0.85; transform: scale(0.99); }
        .btn-reset { background: rgba(255,255,255,0.08); color: #fff; }
        .btn-notify { background: rgba(66,184,131,0.15); color: #42b883; }
        .btn-close { background: rgba(255,107,107,0.15); color: #ff6b6b; }

        .loading {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            color: rgba(255,255,255,0.5); font-size: 14px; z-index: 5;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(66,184,131,0.15); border-top-color: #42b883;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://unpkg.com/vue@3.4/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        const pendingCallbacks = {};
        const generateCallbackId = () => "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9);

        function sendCallback(action, payload, toServer = true) {
            return new Promise((resolve) => {
                const id = generateCallbackId();
                pendingCallbacks[id] = resolve;
                window.parent.postMessage({
                    type: "mphone:callback",
                    action, payload: payload || {}, callbackId: id, server: toServer,
                }, "*");
                setTimeout(() => {
                    if (pendingCallbacks[id]) {
                        resolve({ success: false, error: "Timeout" });
                        delete pendingCallbacks[id];
                    }
                }, 10000);
            });
        }

        const App = {
            setup() {
                const ready = ref(false);
                const player = ref(null);
                const count = ref(0);
                const pulse = ref(false);

                function pulseCounter() {
                    pulse.value = true;
                    setTimeout(() => (pulse.value = false), 150);
                }

                async function increment() {
                    const r = await sendCallback("increment");
                    if (r.success) { count.value = r.count; pulseCounter(); }
                }
                async function decrement() {
                    const r = await sendCallback("decrement");
                    if (r.success) { count.value = r.count; pulseCounter(); }
                }
                async function reset() {
                    const r = await sendCallback("reset");
                    if (r.success) { count.value = r.count; pulseCounter(); }
                }
                function notify() {
                    window.parent.postMessage({
                        type: "mphone:notification",
                        header: "Counter (Vue)",
                        message: "Current count: " + count.value,
                    }, "*");
                }
                function close() {
                    window.parent.postMessage({ type: "mphone:close" }, "*");
                }

                window.addEventListener("message", async (event) => {
                    const data = event.data;
                    if (!data || !data.type) return;

                    if (data.type === "mphone:init") {
                        player.value = data.player;
                        ready.value = true;
                        await nextTick();
                        const r = await sendCallback("getCounter");
                        if (r.success) count.value = r.count;
                    } else if (data.type === "mphone:callback:response") {
                        const cb = pendingCallbacks[data.callbackId];
                        if (cb) { cb(data.result); delete pendingCallbacks[data.callbackId]; }
                    }
                });

                return { ready, player, count, pulse, increment, decrement, reset, notify, close };
            },
            template: `
                <div v-if="!ready" class="loading">
                    <div class="spinner"></div>
                    <p>Loading…</p>
                </div>
                <div v-else class="app-shell">
                    <div class="header">
                        <h1>Counter</h1>
                        <span class="badge">Vue 3</span>
                    </div>
                    <div class="player-info">
                        <div class="label">Phone Number</div>
                        <div class="value">{{ player?.phoneNumber || "—" }}</div>
                    </div>
                    <div class="counter-display">
                        <div class="counter-value" :class="{ pulse }">{{ count }}</div>
                        <div class="button-group">
                            <button class="btn btn-decrement" @click="decrement">−</button>
                            <button class="btn btn-increment" @click="increment">+</button>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="action-btn btn-reset" @click="reset">Reset</button>
                        <button class="action-btn btn-notify" @click="notify">Notify</button>
                        <button class="action-btn btn-close" @click="close">Close</button>
                    </div>
                </div>
            `,
        };

        createApp(App).mount("#app");
    </script>
</body>
</html>
