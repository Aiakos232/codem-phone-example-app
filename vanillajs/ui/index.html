<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
            font-family: "SF Pro", "Roboto", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #030b16;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* App fills viewport via absolute positioning (iframe-safe) */
        .app-shell {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 64px 24px 32px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .app-shell::-webkit-scrollbar { display: none; }

        /* ── Header ─────────────────────────────────────────────────────────── */
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.1;
        }
        .header p {
            margin-top: 6px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: -0.23px;
        }

        /* ── Player info card ───────────────────────────────────────────────── */
        .player-info {
            background: #101622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 20px;
        }
        .player-info .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: -0.23px;
            margin-bottom: 4px;
        }
        .player-info .value {
            font-size: 16px;
            font-weight: 510;
            letter-spacing: -0.4px;
        }

        /* ── Counter (compact) ──────────────────────────────────────────────── */
        .counter-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: #101622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .counter-value {
            font-size: 44px;
            font-weight: 700;
            color: #64ffda;
            letter-spacing: -1px;
            text-shadow: 0 0 18px rgba(100, 255, 218, 0.25);
            transition: transform 0.15s ease;
            min-width: 70px;
        }
        .counter-value.pulse { transform: scale(1.08); }
        .button-group { display: flex; gap: 10px; }
        .btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, opacity 0.15s ease;
            box-shadow:
                inset 0 4px 2px rgba(255, 255, 255, 0.25),
                0 6px 16px rgba(0, 0, 0, 0.35);
        }
        .btn:active { transform: scale(0.94); opacity: 0.9; }
        .btn-decrement { background: linear-gradient(180deg, #ff6b6b 0%, #d94545 100%); color: #fff; }
        .btn-increment { background: linear-gradient(180deg, #64ffda 0%, #2fbfa0 100%); color: #0a1f1a; }

        /* ── Section title ──────────────────────────────────────────────────── */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            margin: 4px 0 12px;
        }

        /* ── Components library grid ────────────────────────────────────────── */
        .lib-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .lib-btn {
            background: #101622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 14px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, transform 0.1s;
        }
        .lib-btn:hover { background: #16202f; }
        .lib-btn:active { transform: scale(0.98); }
        .lib-btn .lib-icon {
            font-size: 22px;
            line-height: 1;
        }
        .lib-btn .lib-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.23px;
        }
        .lib-btn .lib-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: -0.1px;
        }

        /* ── Last result panel ──────────────────────────────────────────────── */
        .result-panel {
            background: #060d18;
            border: 1px solid rgba(100, 255, 218, 0.15);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 20px;
            min-height: 64px;
            overflow: hidden;
        }
        .result-panel .result-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #64ffda;
            margin-bottom: 6px;
        }
        .result-panel pre {
            font-family: "SF Mono", "Roboto Mono", monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
            max-height: 160px;
            overflow-y: auto;
        }
        .result-panel pre::-webkit-scrollbar { width: 4px; }
        .result-panel pre::-webkit-scrollbar-thumb {
            background: rgba(100, 255, 218, 0.3);
            border-radius: 2px;
        }

        /* ── Action buttons ─────────────────────────────────────────────────── */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .action-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 510;
            letter-spacing: -0.23px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .action-btn:active { opacity: 0.85; transform: scale(0.99); }
        .btn-reset { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .btn-notify { background: rgba(100, 255, 218, 0.15); color: #64ffda; }
        .btn-close { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }

        /* ── Loading spinner ────────────────────────────────────────────────── */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            z-index: 5;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(100, 255, 218, 0.15);
            border-top-color: #64ffda;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading…</p>
    </div>

    <div id="app" class="app-shell" style="display: none;">
        <div class="header">
            <h1>Counter</h1>
            <p>External app example</p>
        </div>

        <div class="player-info">
            <div class="label">Phone Number</div>
            <div class="value" id="phoneNumber">—</div>
        </div>

        <div class="counter-display">
            <div class="counter-value" id="counter">0</div>
            <div class="button-group">
                <button class="btn btn-decrement" type="button" onclick="decrement()">−</button>
                <button class="btn btn-increment" type="button" onclick="increment()">+</button>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════════
             COMPONENTS LIBRARY — built-in popup/dialog API examples
             (lb-phone uyumlu globalThis.components.* API'si)
             ═══════════════════════════════════════════════════════════════════ -->
        <div class="section-title">Components Library</div>
        <div class="lib-grid">
            <button class="lib-btn" type="button" onclick="examplePopUp()">
                <span class="lib-icon">⚠️</span>
                <span class="lib-title">setPopUp</span>
                <span class="lib-sub">Confirm dialog</span>
            </button>
            <button class="lib-btn" type="button" onclick="exampleContactSelector()">
                <span class="lib-icon">👤</span>
                <span class="lib-title">setContactSelector</span>
                <span class="lib-sub">Pick a contact</span>
            </button>
            <button class="lib-btn" type="button" onclick="exampleGallery()">
                <span class="lib-icon">🖼️</span>
                <span class="lib-title">setGallery</span>
                <span class="lib-sub">Pick photo(s)</span>
            </button>
            <button class="lib-btn" type="button" onclick="exampleEmojiPicker()">
                <span class="lib-icon">😀</span>
                <span class="lib-title">setEmojiPickerVisible</span>
                <span class="lib-sub">Pick an emoji</span>
            </button>
            <button class="lib-btn" type="button" onclick="exampleNearbyPlayers()">
                <span class="lib-icon">📡</span>
                <span class="lib-title">setNearbyPlayers</span>
                <span class="lib-sub">Pick nearby player</span>
            </button>
            <button class="lib-btn" type="button" onclick="exampleForm()">
                <span class="lib-icon">📝</span>
                <span class="lib-title">setForm</span>
                <span class="lib-sub">Multi-field input</span>
            </button>
            <button class="lib-btn" type="button" onclick="examplePaySheet()">
                <span class="lib-icon">💳</span>
                <span class="lib-title">setPaySheet</span>
                <span class="lib-sub">Payment confirm</span>
            </button>
        </div>

        <div class="result-panel">
            <div class="result-label">Last result</div>
            <pre id="lastResult">— nothing called yet —</pre>
        </div>

        <div class="actions">
            <button class="action-btn btn-reset" type="button" onclick="resetCounter()">Reset</button>
            <button class="action-btn btn-notify" type="button" onclick="showNotification()">Notify</button>
            <button class="action-btn btn-close" type="button" onclick="closeApp()">Close</button>
        </div>
    </div>

    <script>
        let playerData = null;
        let currentCount = 0;
        const pendingCallbacks = {};

        function generateCallbackId() {
            return "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9);
        }

        // ── Phone → app messages ────────────────────────────────────────────────
        window.addEventListener("message", (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case "mphone:init":
                    playerData = data.player;
                    document.getElementById("phoneNumber").textContent =
                        data.player?.phoneNumber || "—";
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("app").style.display = "flex";
                    loadCounter();
                    break;

                case "mphone:callback:response":
                    {
                        const cb = pendingCallbacks[data.callbackId];
                        if (cb) {
                            cb(data.result);
                            delete pendingCallbacks[data.callbackId];
                        }
                    }
                    break;

                case "broadcast":
                    // Broadcast messages from the server
                    break;
            }
        });

        // ── App → phone callback wrapper ────────────────────────────────────────
        function sendCallback(action, payload, toServer = true) {
            return new Promise((resolve) => {
                const callbackId = generateCallbackId();
                pendingCallbacks[callbackId] = resolve;
                window.parent.postMessage({
                    type: "mphone:callback",
                    action,
                    payload: payload || {},
                    callbackId,
                    server: toServer,
                }, "*");
                setTimeout(() => {
                    if (pendingCallbacks[callbackId]) {
                        resolve({ success: false, error: "Timeout" });
                        delete pendingCallbacks[callbackId];
                    }
                }, 10000);
            });
        }

        function updateDisplay(value) {
            currentCount = value;
            const el = document.getElementById("counter");
            el.textContent = value;
            el.classList.add("pulse");
            setTimeout(() => el.classList.remove("pulse"), 150);
        }

        async function loadCounter() {
            const result = await sendCallback("getCounter");
            if (result.success) updateDisplay(result.count);
        }

        async function increment() {
            const result = await sendCallback("increment");
            if (result.success) updateDisplay(result.count);
        }

        async function decrement() {
            const result = await sendCallback("decrement");
            if (result.success) updateDisplay(result.count);
        }

        async function resetCounter() {
            const result = await sendCallback("reset");
            if (result.success) updateDisplay(result.count);
        }

        function showNotification() {
            window.parent.postMessage({
                type: "mphone:notification",
                header: "Counter",
                message: "Current count: " + currentCount,
            }, "*");
        }

        function closeApp() {
            window.parent.postMessage({ type: "mphone:close" }, "*");
        }

        // ════════════════════════════════════════════════════════════════════════
        // COMPONENTS LIBRARY — globalThis.components.* examples
        // The SDK is auto-injected into the iframe by codem-phone; you can call
        // these methods directly with no extra wiring required.
        // ════════════════════════════════════════════════════════════════════════

        function setLastResult(label, payload) {
            const el = document.getElementById("lastResult");
            if (!el) return;
            el.textContent = "[" + label + "]\n" + JSON.stringify(payload, null, 2);
        }

        function ensureComponents() {
            if (typeof globalThis.components === "undefined") {
                setLastResult("error",
                    { error: "globalThis.components was not injected — is the app running inside the phone?" });
                return false;
            }
            return true;
        }

        // ── 1) setPopUp — confirm dialog (N buttons + per-button cb) ───────────
        async function examplePopUp() {
            if (!ensureComponents()) return;
            const result = await components.setPopUp({
                title: "Reset phone?",
                description: "All your data will be wiped. This cannot be undone.",
                buttons: [
                    { title: "Cancel",  color: "red",  cb: () => console.log("[popup] cancelled") },
                    { title: "Continue", color: "blue", cb: () => console.log("[popup] confirmed") }
                ]
            });
            setLastResult("setPopUp", result);
        }

        // ── 2) setContactSelector — pick one of the phone's contacts ───────────
        async function exampleContactSelector() {
            if (!ensureComponents()) return;
            const result = await components.setContactSelector({
                title: "Send to whom?",
                onSelect: (contact) => console.log("[contact] picked:", contact)
            });
            setLastResult("setContactSelector", result);
        }

        // ── 3) setGallery — photo picker (multi-select) ────────────────────────
        async function exampleGallery() {
            if (!ensureComponents()) return;
            const result = await components.setGallery({
                title: "Pick a photo",
                multiselect: true,
                imageOnly: true,
                maxAmount: 4,
                onSelect: (urls) => console.log("[gallery] selected URLs:", urls)
            });
            setLastResult("setGallery", result);
        }

        // ── 4) setEmojiPickerVisible — open/close the emoji picker ─────────────
        async function exampleEmojiPicker() {
            if (!ensureComponents()) return;
            const result = await components.setEmojiPickerVisible(true, {
                onSelect: (emoji) => console.log("[emoji] picked:", emoji)
            });
            setLastResult("setEmojiPickerVisible", result);
            // Programmatic close: components.setEmojiPickerVisible(false);
        }

        // ── 5) setNearbyPlayers — nearby player picker ─────────────────────────
        async function exampleNearbyPlayers() {
            if (!ensureComponents()) return;
            const result = await components.setNearbyPlayers({
                title: "Pick a player",
                onSelect: (player) => console.log("[nearby] picked:", player)
            });
            setLastResult("setNearbyPlayers", result);
        }

        // ── 6) setForm — multi-field input (interval is optional) ──────────────
        async function exampleForm() {
            if (!ensureComponents()) return;
            const result = await components.setForm({
                title: "Add New Contact",
                description: "Fill in the details to add a phonebook entry.",
                confirmText: "Add",
                fields: [
                    { placeholder: "Full name", value: "", type: "text" },
                    { placeholder: "Phone",     value: "", type: "number" }
                ],
                interval: { hours: "08", minutes: "30", label: "Reminder", suffix: "hours" },
                onConfirm: (fields, interval) => {
                    console.log("[form] submitted:", fields, "interval:", interval);
                }
            });
            setLastResult("setForm", result);
        }

        // ── 7) setPaySheet — payment confirmation (auto multi-item total) ──────
        async function examplePaySheet() {
            if (!ensureComponents()) return;
            const result = await components.setPaySheet({
                title: "Cart checkout",
                accountName: "Aiakos Bank — **** 4832",
                fromLabel: "Pay from account",
                confirmLabel: "Pay now",
                items: [
                    { label: "Premium membership",  amount: 49.90 },
                    { label: "Extra storage (50GB)", amount: 19.90 },
                    { label: "Discount",            amount: -9.80 }
                ],
                onConfirm: (r) => console.log("[pay] confirmed, total:", r.total),
                onCancel:  ()  => console.log("[pay] cancelled")
            });
            setLastResult("setPaySheet", result);
        }

        // Standalone test (file:// or localhost)
        if (window.location.protocol === "file:" || window.location.hostname === "localhost") {
            setTimeout(() => {
                window.dispatchEvent(new MessageEvent("message", {
                    data: {
                        type: "mphone:init",
                        player: { phoneNumber: "555-1234" },
                        theme: "dark",
                        language: "en",
                    },
                }));
            }, 300);
        }
    </script>
</body>
</html>
